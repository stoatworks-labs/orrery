  <body>
    <main id="demo">
      <noscript>
        <h1>Orrery</h1>
        <p>
          Simple shapes moving on deterministic paths, as an FFGL source and a
          matching mask effect. Eight shapes, five paths, and a phase you can
          lock to the host's bar, for quick animated masks and for chroma chases
          driving a pixel map.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/orrery/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/orrery/">Project page and downloads</a></li>

        </ul>
      </noscript>
